<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Library</title>
    <style>
        body { font-family: sans-serif; margin: 2rem auto; max-width: 40rem; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
        th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
        label { display: inline-block; width: 5rem; }
        .row { margin: 0.4rem 0; }
    </style>
</h:head>
<h:body>
    <h1>Library</h1>
    <p>Books stored in MySQL through the Payara datasource <code>jdbc/demo</code>.</p>

    <h:form>
        <h:dataTable value="#{bookBean.books}" var="book" border="0">
            <h:column>
                <f:facet name="header">Title</f:facet>
                #{book.title}
            </h:column>
            <h:column>
                <f:facet name="header">Author</f:facet>
                #{book.author}
            </h:column>
        </h:dataTable>

        <div class="row">
            <label for="title">Title</label>
            <h:inputText id="title" value="#{bookBean.title}" required="true"/>
        </div>
        <div class="row">
            <label for="author">Author</label>
            <h:inputText id="author" value="#{bookBean.author}" required="true"/>
        </div>
        <h:commandButton value="Add book" action="#{bookBean.add}"/>
    </h:form>

    <p>REST: <a href="api/books">/library/api/books</a></p>
</h:body>
</html>
