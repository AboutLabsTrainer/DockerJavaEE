services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # Rows stay in the named volume mysql_data. down keeps them; down -v drops them so BookSeeder runs again.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  payara:
    build:
      context: .
      dockerfile: payara/Dockerfile
    ports:
      - "8080:8080"
      - "4848:4848"
      - "9009:9009"
    environment:
      ADMIN_PASSWORD: admin
      PAYARA_ARGS: "--debug"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
